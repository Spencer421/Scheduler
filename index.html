
<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25Live Room Reservations</title>
    <link rel="icon" type="image/png" href="DSU_UniversityLogo_Icon_Primary.png">
    <link rel="stylesheet" href="dsu.css">
</head>
<body>
    <h1>&#8288;<a href="https://dsu.edu" style="text-decoration:none"> <img src="DSU_UniversityLogo_Icon_Primary.png" height="30px" alt="DSU Logo"> </a>&#8288;DSU Campus Reservations</h1>
    
    
        <div id="filter-bar">
            <label for="RoomID_dropdown">&#8288;Filter by Room:</label>
            <select id="RoomID_dropdown">
                <option value="">Show All Rooms</option>
            </select>
        </div>
    
    
    <div class="table-container">
        <html><head><meta charset="utf-8"/><title>SheetJS Table Export</title></head><body><table><tr><td data-t="s" data-v="Room" id="sjs-A1">Room</td><td data-t="s" data-v="Day" id="sjs-B1">Day</td><td data-t="s" data-v="Month" id="sjs-C1">Month</td><td data-t="s" data-v="Date" id="sjs-D1">Date</td><td data-t="s" data-v="Reservation" id="sjs-E1">Reservation</td></tr></table></body></html>
        <div id="no-reservations-msg">No reservations currently scheduled.</div>
    </div>
    
    
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const MONTHS = [
            "january", "february", "march", "april", "may", "june",
            "july", "august", "september", "october", "november", "december"
        ];
 
        const ROOM_NAMES = {"DBH*106":"Beadle Hall Conference Room","DBIT*202":"Beacom 202","DBIT*235":"Beacom 235","DDPP*CONFERENCE":"Dakota Prairie PlayHouse Conference","DEB*102 CONFERENCE ROOM":"Entrepreneurial Building 102","DEH*109":"East Hall 109","DHH*BRINKER":"HH Brinker - 210","DHH*MONTGOMERY":"HH Montgomery - 109","DHH*PRES CONF ROOM":"HH President's Conference Room","DLEC*016":"LEC Conference Room - 016","DLIB*125 CONFERENCE ROOM":"Library 125 - Conference Room","DLIB*201":"Library 201","DMAD*112":"MadLabs Briefing Room - 112","DMAD*134":"MadLabs Conference Room - 134","DMAD*135":"MadLabs Conference Room - 135","DSC*132":"Science Center 132","DSC*133":"Science Center 133","DTC*ALUMNI":"TC Alumni Room - 26","DTC*CLUB HUB CONFERENCE ROOM":"Club Hub Conference Room - 126","DTC*OYATE":"Oyate Room - 102","DTC*STUDENT SERVICES CONFERENCE ROOM":"Student Services Conference Room - 120","DDPP*101":"Dakota Prairie PlayHouse Theatre","DEH*100":"East Hall 100","DSC*135":"Science Center 135","DTCB*203":"Tunheim Classroom Building 203"};
 
        const MONTH_COL = 2;
        const DATE_COL  = 3;
        const ROOM_COL  = 0;
 
        const dropdown = document.getElementById('RoomID_dropdown');
        const table    = document.querySelector('table');
        const rows     = Array.from(table.querySelectorAll('tr')).slice(1);
 
        const today = new Date();
        today.setHours(0, 0, 0, 0);
 
        rows.forEach(row => {
            const cells = row.cells;
            if (!cells || cells.length <= DATE_COL) return;
 
            const monthText = cells[MONTH_COL] ? cells[MONTH_COL].textContent.trim() : "";
            const dateText  = cells[DATE_COL]  ? cells[DATE_COL].textContent.trim()  : "";
 
            const mIdx = MONTHS.indexOf(monthText.toLowerCase());
            const dNum = parseInt(dateText.replace(/\D/g, ""), 10);
 
            if (mIdx === -1 || isNaN(dNum)) return;
 
            let year = today.getFullYear();
            if (today.getMonth() === 11 && mIdx === 0) year += 1;
 
            const reservationDate = new Date(year, mIdx, dNum);
 
            if (reservationDate < today) {
                row.style.display    = "none";
                row.dataset.pastDate = "true";
            }
        });
 
        const applyFilter = (rawID) => {
            const filterValue = rawID.toUpperCase().trim();
            let visibleCount = 0;

            rows.forEach(row => {
                if (row.dataset.pastDate === "true") {
                    row.style.display = "none";
                    return;
                }
                const cell = row.cells[ROOM_COL];
                if (cell) {
                    let rowText = (cell.getAttribute('data-raw-id') || cell.textContent.trim()).toUpperCase();
                    if (rowText.startsWith("ROOM: ")) rowText = rowText.substring(6);
                    const show = (filterValue === "" || rowText === filterValue);
                    row.style.display = show ? "" : "none";
                    if (show) visibleCount++;
                }
            });

            const msg = document.getElementById('no-reservations-msg');
            if (msg) msg.style.display = (visibleCount === 0) ? "block" : "none";
        };
 
        const urlParams   = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('roomID');
        if (roomFromUrl) {
            const upperRoom = roomFromUrl.toUpperCase();
            for (let option of dropdown.options) {
                if (option.value.toUpperCase() === upperRoom) {
                    dropdown.value = option.value;
                    break;
                }
            }
        }

        // Always run filter on load so the no-reservations message starts correctly hidden
        applyFilter(dropdown.value);
 
        dropdown.addEventListener('change', (event) => {
            applyFilter(event.target.value);
        });
    });
</script>

    
    <footer>
        <a href="https://25live.collegenet.com/pro/sdbor" style="text-decoration:none; font-weight:bold; font-size:16px; color:#003552;">Go to 25Live</a>
    </footer>

</body>
</html>
